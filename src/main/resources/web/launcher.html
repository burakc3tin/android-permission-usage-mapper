<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>APUM · Android Permission Usage Mapper</title>
<style>/*__APUM_LAUNCHER_STYLES__*/</style>
</head>
<body>
<main class="launcher">
  <header class="brand">
    <span class="logo">APUM</span>
    <h1>Android Permission Usage Mapper</h1>
  </header>

  <button id="folder-field" class="folder-field is-empty" type="button">
    <span id="folder-value">Choose project folder</span>
  </button>

  <button id="analyze" class="primary-button" type="button" disabled>Analyze</button>

  <p id="status" class="status" role="status" aria-live="polite"></p>

  <section id="result" class="result" hidden>
    <div id="result-stats" class="stats"></div>
    <button id="open-report" class="ghost-button" type="button">Open report</button>
  </section>
</main>
<script>/*__APUM_LAUNCHER_SCRIPT__*/</script>
</body>
</html>
